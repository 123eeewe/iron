[package]
name = "ironchest"
version = "1.0.0"
edition = "2021"
description = "IronChest-аналог для Minecraft Horizon (Mod Studio). Точка входа: modentry."

[lib]
name = "ironchest"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Заглушки игрового API для десктопных автотестов ядра
stub = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
