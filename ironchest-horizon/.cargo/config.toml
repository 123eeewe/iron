# Кросс-компиляция под Android (ARM64 + ARMv7) через NDK — эти тулчейны
# соответствуют сборке мода в Mod Studio Horizon. Путь к NDK: $ANDROID_NDK_HOME
[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"
